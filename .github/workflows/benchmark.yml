name: Benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" pytest-benchmark
      - name: Run benchmark
        run: pytest benchmarks/ --benchmark-json=bench.json -q --benchmark-min-rounds=5
        continue-on-error: true
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: nqs-vmc
          tool: pytest
          output-file-path: bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          comment-on-alert: true
          alert-threshold: "130%"
          fail-on-alert: false