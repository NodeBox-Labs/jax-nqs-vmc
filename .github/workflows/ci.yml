name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" ruff mypy
      - name: Ruff check
        run: ruff check src scripts tests
      - name: Ruff format check
        run: ruff format --check src scripts tests
      - name: mypy strict
        run: mypy src/nqs_vmc
      - name: Verify no __pycache__ or results committed
        run: |
          if git ls-files | grep -E '(__pycache__|\.pyc$|^results/[^.]|\.egg-info)'; then
            echo "::error::Generated files committed to the repo"
            exit 1
          fi

  fast:
    name: fast (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fast tests
        run: pytest -q -m "not slow" --cov=src/nqs_vmc --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  slow:
    name: slow (Linux py3.11)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Slow tests (VMC convergence + determinism)
        run: pytest -q -m slow

  cli-smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: nqs-vmc run on HO ground state (short)
        run: |
          nqs-vmc --help
          nqs-vmc run --config configs/ho_ground.yaml
      - name: Verify artifacts
        run: |
          test -f results/ho_ground/aggregate.json
          python -c "
          import json
          agg = json.load(open('results/ho_ground/aggregate.json'))
          assert 'final_energy' in agg
          assert abs(agg['final_energy']['mean'] - 0.5) < 0.05
          "